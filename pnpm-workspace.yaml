# Single-project root (publishable @tweakcad/mcp-bridge). No workspace deps —
# the bridge is pure relay (sdk + ws only); the tool catalogue is advertised
# by the browser at runtime.
packages:
  - '.'
allowBuilds:
  esbuild: true
# pnpm hardening.
strictPeerDependencies: true
autoInstallPeers: true
preferFrozenLockfile: true
verifyStoreIntegrity: true
resolutionMode: highest
